services:
  app:
    image: python:3.12-slim
    container_name: python-app
    working_dir: /app
    volumes:
      - ./app.py:/app/app.py
    command: sh -c "pip install mysql-connector-python && python app.py"
    depends_on:
      - db

  db:
    image: mysql:8.4
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: example123
      MYSQL_DATABASE: classicmodels
    ports:
      - "3306:3306"