services:
  web:
    image: mysql-world-python-api:1.0.0
    build: .
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      MYSQL_HOST: ${MYSQL_HOST:-db}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-classicmodels_api}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      MYSQL_DATABASE: ${MYSQL_DATABASE:-classicmodels}
    secrets:
      - mysql_app_password
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      - uvicorn
      - app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --log-level
      - ${APP_LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./certs}:/certs:ro
    depends_on:
      web:
        condition: service_healthy

  db:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${MYSQL_DATABASE:-classicmodels}
    secrets:
      - mysql_root_password
      - mysql_app_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot --password="$$(cat /run/secrets/mysql_root_password)" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:

secrets:
  mysql_root_password:
    file: ${MYSQL_ROOT_SECRET_SOURCE:-./secrets/mysql_root_password.txt}
  mysql_app_password:
    file: ${MYSQL_APP_SECRET_SOURCE:-./secrets/mysql_app_password.txt}
